name: Translate

# Each night, and on demand before a release: list the program's text again
# (lupdate), translate what is new or changed into every language with
# Claude (tools/translate/translate.py), and commit the result as
# JeffOffice LLC. Without the ANTHROPIC_API_KEY secret it does nothing, except
# the variants job below (English and Spanish for Spain), which needs no key.

on:
  schedule:
    - cron: '17 7 * * *'   # 3:17 AM Eastern
  workflow_dispatch:
    inputs:
      languages:
        description: 'Languages, comma-separated, or all (empty: the ones already started)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-24.04
    steps:
      - name: Look for the API key
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "have=yes" >> "$GITHUB_OUTPUT"; else echo "::notice::No ANTHROPIC_API_KEY secret: nothing translated."; fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.key.outputs.have == 'yes'

      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        if: steps.key.outputs.have == 'yes'
        with:
          aqtversion: '==3.3.0'
          version: '6.8.3'
          modules: 'qtimageformats qtmultimedia'
          cache: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.key.outputs.have == 'yes'
        with:
          python-version: '3.13'

      - name: List the program's text
        if: steps.key.outputs.have == 'yes'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target jeffoffice_lupdate

      - name: Translate
        if: steps.key.outputs.have == 'yes'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGUAGES: ${{ inputs.languages }}
        run: |
          pip install -q -r tools/translate/requirements.txt
          # (2: the service refused the key, so nothing can be translated; 3: some text was left, as before; anything else, such as 1, the
          # translator crashed. Only 3 lets the run go on to commit what was translated.)
          rc=0
          python3 tools/translate/translate.py ${LANGUAGES:+--lang "$LANGUAGES"} --report report.md || rc=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$rc" = 2 ]; then echo "::error::The translation service refused ANTHROPIC_API_KEY: replace the secret."; exit 1; fi
          if [ "$rc" = 3 ]; then echo "::warning::Some text was not translated; see the summary."; elif [ "$rc" != 0 ]; then echo "::error::The translator stopped (exit $rc); see the log."; exit 1; fi

      - name: Commit
        if: steps.key.outputs.have == 'yes'
        run: |
          # The lists of English text are the developers' to commit (lupdate
          # before a release); only the translations go in here.
          git checkout -- translations/jeffoffice.ts translations/jeffoffice_en.ts
          git add translations resources/help resources/resources.qrc
          if git diff --cached --quiet; then echo "Nothing new to translate."; exit 0; fi
          # The identity for the commit and for replaying it onto a newer main.
          git config user.name "JeffOffice LLC"
          git config user.email "info@jeffoffice.com"
          git commit -q -m "Translations of new and changed text"
          for i in 1 2 3 4 5; do
            # On a clash in a translation file, this run's version wins: it
            # holds lupdate's latest list and the new translations.
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 20
          done
          echo "::error::Could not push the translations."
          exit 1

  # English (United Kingdom, Canada, Australia) is made from the American English
  # text by a word list (tools/translate/english_variants.py): no API key, no
  # network, so it runs whether or not the secret is set. It reads the committed
  # translations/jeffoffice.ts and resources/help/en.
  # Spanish for Spain (es_ES) is made the same way from the neutral Spanish
  # (tools/translate/spanish_variants.py), so this job runs after the translation
  # job has committed any new Spanish text, and the translator never touches es_ES.
  english-variants:
    needs: translate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Make the English variants
        run: python3 tools/translate/english_variants.py

      - name: Make the Spanish (Spain) variant
        run: |
          python3 tools/translate/spanish_variants.py
          python3 tools/translate/spanish_variants.py --check
          python3 -I tools/test_spanish_variants.py

      - name: Commit
        run: |
          git add translations resources/help resources/resources.qrc
          if git diff --cached --quiet; then echo "The variants are current."; exit 0; fi
          git config user.name "JeffOffice LLC"
          git config user.email "info@jeffoffice.com"
          git commit -q -m "English and Spanish variants of new and changed text"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 20
          done
          echo "::error::Could not push the variants."
          exit 1
