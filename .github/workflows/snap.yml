name: snap

# Builds the JeffOffice snap (snap/snapcraft.yaml) from the chosen ref and keeps
# the .snap as an artifact. By hand only for now: Actions > snap > Run workflow.
#
# The second job sends the snap to the Snap Store's edge channel. It does
# nothing unless "upload_to_edge" is ticked AND the repository secret
# SNAPCRAFT_STORE_CREDENTIALS exists (made with `snapcraft export-login`,
# limited to the jeffoffice name and the edge channel, once the store has
# approved the name).

on:
  workflow_dispatch:
    inputs:
      upload_to_edge:
        description: "After the build, upload the snap to the store's edge channel"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # (Any branch may build the snap to test it; only main may upload it, which the upload job checks too.)
      - name: Upload only from main
        env:
          REF: ${{ github.ref }}
          UPLOAD: ${{ inputs.upload_to_edge }}
        run: |
          if [ "$UPLOAD" = true ] && [ "$REF" != refs/heads/main ]; then
            echo "::error::The snap is uploaded only from main, not from $REF."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build the snap
        id: build
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0

      # Every FFmpeg library in the snap and in the KDE content snap it runs on, and the runtime probe (tools/ffmpeg_probe.c) on the copy the multimedia plugin
      # loads first in the snap's library path order: it must be our minimal build, not a distribution's or the content snap's full one.
      - name: FFmpeg inside the snap
        timeout-minutes: 20
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          set -x
          sudo apt-get install -y squashfs-tools
          # (a hang here fails in minutes, with the step's own message, instead of holding the run)
          timeout 600 snap download kf6-core24 --channel=latest/stable --basename=kf6-core24 || { echo "::error::could not download the kf6-core24 content snap (exit $?)"; exit 1; }
          ls -la kf6-core24.snap "$SNAP_FILE"
          timeout 900 python3 -u tools/snap_ffmpeg_audit.py "$SNAP_FILE" kf6-core24.snap || { echo "::error::the FFmpeg audit of the snap failed or took over 15 minutes (exit $?)"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JeffOffice-snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  upload-edge:
    needs: build
    if: ${{ inputs.upload_to_edge }}
    runs-on: ubuntu-24.04
    steps:
      - name: Only from main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::The snap is uploaded only from main, not from $REF."
            exit 1
          fi

      - name: Check for the store credentials
        id: creds
        env:
          HAVE: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
        run: |
          if [ "$HAVE" = true ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SNAPCRAFT_STORE_CREDENTIALS is not set, so nothing was uploaded."
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.creds.outputs.have == 'true'
        with:
          name: JeffOffice-snap
          path: snap-out

      - name: Find the snap
        if: steps.creds.outputs.have == 'true'
        id: file
        run: echo "snap=$(ls snap-out/*.snap)" >> "$GITHUB_OUTPUT"

      - uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        if: steps.creds.outputs.have == 'true'
        with:
          snap: ${{ steps.file.outputs.snap }}
          release: edge
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
