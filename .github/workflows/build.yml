name: build

on:
  push:
    branches: [main]
    # The feature lists and the website's text from them change nothing that is built or tested.
    paths-ignore:
      - 'docs/features/**'
      - 'tools/features/**'
      - '.github/workflows/features.yml'
  pull_request:
  # By hand, to build and test a branch before it goes to main:
  # gh workflow run build.yml --ref <branch> -f mac_both=false
  workflow_dispatch:
    inputs:
      mac_both:
        description: 'Build the Mac programs for both processors (Apple and Intel), as a release needs'
        type: boolean
        default: true

jobs:
  # JeffDeck plays movies and sounds through Qt Multimedia's FFmpeg plugin. Qt ships the full FFmpeg (hundreds of demuxers and decoders, each one a way
  # in for a file from a stranger); ours has only what a presentation holds, built from the official source by tools/build_ffmpeg.sh. Built once for each
  # system (both processors on the Mac) and kept in GitHub's cache, under a key made of the FFmpeg version and the hash of the script; the build jobs
  # below restore it and put it in their copy of Qt (tools/use_ffmpeg.sh). Windows builds it with MSYS2's MinGW-w64, the Mac with Xcode's compiler.
  ffmpeg:
    name: ffmpeg (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: windows
            os: windows-2022
          - name: arm64
            os: macos-15
          - name: x86_64
            os: macos-15
    # (the same machines as the build jobs below: the Linux build runs on our own, whose C library is the one ours must run on)
    runs-on: ${{ (matrix.name == 'linux' && github.event_name != 'pull_request') && fromJSON('["self-hosted", "jo-linux"]') || matrix.os }}
    timeout-minutes: 45
    steps:
      # Our own Linux machines keep their workspace between jobs, and a job's checkout changes the repository there for the next job (a sparse one did, on Nov 9,
      # and broke the next job's checkout on every branch). This job's tree is its own folder, a separate repository the next job's checkout cleans away; nothing
      # here touches the workspace's own checkout, and the cache and the build are outside it too.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: ffmpeg-src

      - name: Which FFmpeg
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^VERSION=\${FFMPEG_VERSION:-\(.*\)}$/\1/p' ffmpeg-src/tools/build_ffmpeg.sh)" >> "$GITHUB_OUTPUT"

      - name: Our FFmpeg (cache)
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ffmpeg-out/${{ matrix.name }}
          key: ffmpeg-${{ steps.version.outputs.version }}-${{ matrix.name }}-${{ hashFiles('ffmpeg-src/tools/build_ffmpeg.sh') }}

      - name: Build tools (Linux)
        if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y nasm xz-utils

      - name: Build tools (macOS)
        if: runner.os == 'macOS' && steps.cache.outputs.cache-hit != 'true'
        run: brew list nasm >/dev/null 2>&1 || brew install nasm

      - name: Build FFmpeg (Linux, macOS)
        if: runner.os != 'Windows' && steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          FFMPEG_ARCH: ${{ runner.os == 'macOS' && matrix.name || '' }}
          FFMPEG_JOBS: '4'
        run: sh ffmpeg-src/tools/build_ffmpeg.sh "$PWD/ffmpeg-out/${{ matrix.name }}" "$RUNNER_TEMP/ffmpeg-build"

      # MSYS2 is on the runner image; its MinGW-w64 compiler, make, and nasm are installed into it.
      - name: Build FFmpeg (Windows)
        if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
        shell: 'C:\msys64\usr\bin\bash.exe -l -e -o pipefail {0}'
        env:
          MSYSTEM: MINGW64
          CHERE_INVOKING: '1'
          FFMPEG_JOBS: '4'
        run: |
          pacman -Sy --noconfirm --needed make diffutils xz mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm
          sh ffmpeg-src/tools/build_ffmpeg.sh "$PWD/ffmpeg-out/windows" "$PWD/ffmpeg-build"

      # (every run, a cache hit too: what is kept must be what the committed list says, with none of the banned components)
      - name: Check what was compiled in
        shell: bash
        run: |
          PY=python3; command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" ffmpeg-src/tools/check_ffmpeg_components.py --built "ffmpeg-out/${{ matrix.name }}"
          ls -la ffmpeg-out/${{ matrix.name }}/lib ffmpeg-out/${{ matrix.name }}/bin 2>/dev/null || true

  build:
    needs: ffmpeg
    # (Windows and macOS: "build (windows, tests, 1/2)"; Linux runs each part in one job: "build (linux, tests)")
    name: build (${{ matrix.name }}, ${{ matrix.part }}${{ matrix.name != 'linux' && format(', {0}/2', matrix.shard) || '' }})
    env:
      # JeffWrite and JeffCrunch are built and tested on every run. Each goes into the installer, the Linux packages, and the Mac disk image only
      # when its switch is "true": the owner decides when it ships.
      SHIP_WRITE: 'true'
      SHIP_CRUNCH: 'true'
      # A Mac build for both processors (Apple and Intel) compiles everything twice. Only a run started by hand, the kind a release takes its files from,
      # builds and packages for both (unless it is told mac_both=false, as a branch's test run is); a push builds for Apple's processors alone. Only the
      # job that packages (checks, 1/2) builds for both: the others only test, and a test runs the Apple half of a two-processor program anyway.
      MAC_ARCHS: ${{ github.event_name == 'workflow_dispatch' && inputs.mac_both && matrix.part == 'checks' && matrix.shard == 1 && 'arm64;x86_64' || 'arm64' }}
      # Which half of its part this job is ("1/2" or "2/2"; none on Linux, which runs a part in one job): tools/ci_targets.sh says what each half builds and runs.
      SHARD: ${{ matrix.name == 'linux' && '' || format('{0}/2', matrix.shard) }}
      # Our own machine keeps its compiler cache in a folder of its own, kept from run to run; GitHub's machines keep it in GitHub's cache.
      CCACHE_DIR: ${{ (matrix.name == 'linux' && github.event_name != 'pull_request') && '/ccache' || format('{0}/.ccache', github.workspace) }}
      # (precompiled headers: without these, ccache caches no file that reads one; the header times because a fresh checkout's files are all new)
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    strategy:
      fail-fast: false
      matrix:
        name: [linux, windows, macos]
        # Each system builds twice, side by side (the compiler cache makes the second build a few minutes): one job runs the tests, the other the app
        # checks, the other checks, and the packaging. One after another they took 18 minutes.
        part: [tests, checks]
        # Windows and macOS split each part in two halves that build and run about half each (tools/ci_targets.sh): the checks' first half builds and
        # packages the apps; Linux, on our own machine, has the processors to run a part in one job (and splits the biggest programs, CI_SPLIT).
        shard: [1, 2]
        exclude:
          - name: linux
            shard: 2
        include:
          - name: linux
            os: ubuntu-24.04
          - name: windows
            os: windows-2022
          # One app for Apple silicon and Intel Macs (Qt's macOS build is
          # universal), unsigned for now.
          - name: macos
            os: macos-15
    # Linux runs on our own machine (labels self-hosted + jo-linux), except for pull requests, which run on GitHub's: no one else's code runs there.
    runs-on: ${{ (matrix.name == 'linux' && github.event_name != 'pull_request') && fromJSON('["self-hosted", "jo-linux"]') || matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # (our own Linux machine keeps its workspace between runs, and an earlier run left it with a sparse checkout: files are missing until this)
      - name: Whole tree
        shell: bash
        run: git sparse-checkout disable || true

      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        if: runner.os == 'Linux'
        with:
          # (aqtinstall 3.3.0, the newest release, looks for Windows MinGW Qt 6.11 in the wrong folder: pinned to the commit that lists it)
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7'
          version: '6.11.3'
          modules: 'qtimageformats qtmultimedia'
          cache: true

      # Windows builds with MinGW-w64 (GCC), the compiler Qt ships for Windows.
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        if: runner.os == 'Windows'
        with:
          # (aqtinstall 3.3.0, the newest release, looks for Windows MinGW Qt 6.11 in the wrong folder: pinned to the commit that lists it)
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7'
          version: '6.11.3'
          arch: 'win64_mingw'
          modules: 'qtimageformats qtmultimedia'
          tools: 'tools_mingw1310'
          cache: true

      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        if: runner.os == 'macOS'
        with:
          # (aqtinstall 3.3.0, the newest release, looks for Windows MinGW Qt 6.11 in the wrong folder: pinned to the commit that lists it)
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7'
          version: '6.11.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtimageformats qtmultimedia'
          cache: true

      - name: Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: MinGW on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "$env:IQTA_TOOLS\mingw1310_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          pip install ninja

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libfuse2 libpulse-dev

      # A compiler cache kept from run to run in GitHub's own cache, so a push recompiles what it changed and what
      # includes that, not everything. Each system's own package manager provides ccache.
      - name: ccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ccache

      - name: ccache (macOS)
        if: runner.os == 'macOS'
        run: brew list ccache >/dev/null 2>&1 || brew install ccache

      - name: ccache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # From ccache's own release on GitHub, checked against its published SHA-256: the Chocolatey feed is sometimes down for whole runs, and a
        # Windows build without the cache takes 25-40 minutes instead of 4. The feed is tried only if the download fails; without either the build
        # goes on without the cache.
        run: |
          $v = '4.14.2'; $sum = '6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84'
          $zip = "$env:RUNNER_TEMP\ccache.zip"; $dir = "$env:RUNNER_TEMP\ccache"
          foreach ($try in 1..3) {
            try {
              Invoke-WebRequest "https://github.com/ccache/ccache/releases/download/v$v/ccache-$v-windows-x86_64.zip" -OutFile $zip
              if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $sum) { throw 'checksum mismatch' }
              Expand-Archive $zip -DestinationPath $dir -Force
              (Get-ChildItem $dir -Recurse -Filter ccache.exe | Select-Object -First 1).DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              exit 0
            } catch { Write-Host "ccache download: $_"; Start-Sleep -Seconds 10 }
          }
          foreach ($try in 1..2) { choco install ccache -y --no-progress; if (Get-Command ccache -ErrorAction SilentlyContinue) { break }; Start-Sleep -Seconds 20 }
          exit 0

      # JeffDeck's FFmpeg is ours (the ffmpeg job above), not the full one Qt ships. It goes into this job's copy of Qt before anything is built, so that the tests
      # load it and windeployqt, macdeployqt, and linuxdeploy copy it into the packages. The cache is restored by its key; a missing one fails here.
      - name: Which FFmpeg
        id: ffmpeg
        shell: bash
        run: echo "version=$(sed -n 's/^VERSION=\${FFMPEG_VERSION:-\(.*\)}$/\1/p' tools/build_ffmpeg.sh)" >> "$GITHUB_OUTPUT"

      - name: Our FFmpeg (restore)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ffmpeg-out/${{ matrix.name == 'macos' && 'arm64' || matrix.name }}
          key: ffmpeg-${{ steps.ffmpeg.outputs.version }}-${{ matrix.name == 'macos' && 'arm64' || matrix.name }}-${{ hashFiles('tools/build_ffmpeg.sh') }}
          fail-on-cache-miss: true

      - name: Our FFmpeg for Intel Macs (restore)
        if: runner.os == 'macOS' && contains(env.MAC_ARCHS, ';')
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ffmpeg-out/x86_64
          key: ffmpeg-${{ steps.ffmpeg.outputs.version }}-x86_64-${{ hashFiles('tools/build_ffmpeg.sh') }}
          fail-on-cache-miss: true

      - name: Our FFmpeg in Qt's folder
        shell: bash
        run: |
          QT=$QT_ROOT_DIR
          if [ "$RUNNER_OS" = Windows ]; then QT=$(cygpath -u "$QT_ROOT_DIR"); fi
          if [ "$RUNNER_OS" = macOS ]; then
            P=ffmpeg-out/arm64
            case "$MAC_ARCHS" in *x86_64*) P="$P ffmpeg-out/x86_64" ;; esac
          else
            P=ffmpeg-out/${{ matrix.name }}
          fi
          bash tools/use_ffmpeg.sh install "$QT" $P
          bash tools/use_ffmpeg.sh check "$QT"

      # (what a Mac's plugin loads, printed so that a plugin that does not load can be told from one that does: names, signatures, processors)
      - name: Our FFmpeg on a Mac, as the plugin sees it
        if: runner.os == 'macOS'
        shell: bash
        run: |
          L="$QT_ROOT_DIR/lib"; P="$QT_ROOT_DIR/plugins/multimedia/libffmpegmediaplugin.dylib"
          ls -la "$L"/libav*.dylib "$L"/libsw*.dylib || true
          echo "== plugin"; otool -L "$P" | head -30 || true; otool -l "$P" | grep -A2 LC_RPATH | grep path || true
          echo "== libavcodec"; otool -D "$L/libavcodec.61.dylib" || true; otool -L "$L/libavcodec.61.dylib" | head -8 || true
          otool -l "$L/libavcodec.61.dylib" | grep -A2 LC_RPATH | grep path || true
          echo "== names the plugin imports that ours lacks"
          nm -u "$P" | awk '{print $NF}' | grep -E '^_(av|sw)' | sed 's/^_//' | sort -u > /tmp/need.txt
          for f in "$L"/libav*.61.dylib "$L"/libavutil.59.dylib "$L"/libsw*.dylib; do [ -L "$f" ] || continue; nm -gU "$f" | awk '{print $3}' | sed 's/^_//'; done | sort -u > /tmp/have.txt
          wc -l /tmp/need.txt /tmp/have.txt; comm -23 /tmp/need.txt /tmp/have.txt | head -20 || true
          echo "== which library the plugin expects the names in"; nm -m "$P" | grep -E "_av_dict_get_string|_av_malloc|_avformat_open_input|_sws_scale|_swr_init" | head -10 || true
          echo "== who defines av_dict_get_string"; for f in "$L"/libav*.61.dylib "$L"/libavutil.59.dylib "$L"/libsw*.dylib; do nm -gU "$f" 2>/dev/null | grep -H --label="$(basename "$f")" "_av_dict_get_string" || true; done
          for f in "$L"/libavcodec.61.dylib "$L"/libavformat.61.dylib "$L"/libavutil.59.dylib "$L"/libswresample.5.dylib "$L"/libswscale.8.dylib; do
            echo "$(basename "$f"): $(lipo -archs "$f"), signature: $(codesign -v "$f" 2>&1 | head -1 | sed 's/^$/valid/')"
          done
          exit 0

      # One cache for each job (system, part, half), so that each has its own objects: ccache-<system>-<processors>-<part><half>-<commit>. A job restores
      # the newest of its own, else the newest of any of its system (the first run after a change of the halves, or a half that has none yet), and saves a
      # new one only when it compiled something, after the build (the Save step below). An entry holds one job's objects, and the Build step caps its size:
      # macOS 1 GB (the release's two-processor entry, one job, 1.6 GB), Windows 0.5 GB. The four jobs of a system together keep 4 GB on macOS and 2 GB on
      # Windows; with the Qt caches (2.0 GB) that is 8 GB of GitHub's 10 (a release's entry, rare, is the first to go), so each job's newest entry stays.
      - name: Restore the compiler cache
        if: runner.environment != 'self-hosted'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ matrix.name == 'macos' && env.MAC_ARCHS || '' }}-${{ matrix.part }}${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.name }}-${{ matrix.name == 'macos' && env.MAC_ARCHS || '' }}-${{ matrix.part }}${{ matrix.shard }}-
            ccache-${{ matrix.name }}-${{ matrix.name == 'macos' && env.MAC_ARCHS || '' }}-

      # Each shared library uses only the ones below it (libs/base < draw <
      # text < office < shell < page < flow < apps), and no app reaches into another.
      - name: Layer check
        if: runner.os == 'Linux' && matrix.part == 'checks'
        run: python3 tools/check_layers.py

      # Every text marked for translation is in a form lupdate sees, and none can stall it (the nightly translate.yml runs it over the whole tree).
      - name: Translation call check
        if: runner.os == 'Linux' && matrix.part == 'checks'
        run: python3 tools/check_translate_calls.py

      # No text from a file, the clipboard, or the network is handed to a label, tip, or message box that may take it for markup (and read a picture it names).
      - name: Plain text check
        if: runner.os == 'Linux' && matrix.part == 'checks'
        run: python3 tools/check_plain_text.py

      # Every library, dictionary, font, and license file the program carries has its row in the About pages' Third-party
      # software list, and docs/third-party.json (the website's copy) matches the list.
      - name: Third-party list check
        if: runner.os == 'Linux' && matrix.part == 'checks'
        run: python3 tools/check_third_party.py

      # The FFmpeg JeffDeck ships has only the components a presentation needs: nothing banned in the build script or the committed list of what is compiled in.
      - name: FFmpeg component check
        if: runner.os == 'Linux' && matrix.part == 'checks'
        run: python3 tools/check_ffmpeg_components.py

      # The Done, Partly, and Not yet counts in docs/features/README.md match the feature lists they count.
      - name: Feature count check
        if: runner.os == 'Linux' && matrix.part == 'checks'
        run: python3 tools/check_feature_counts.py

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then CC=gcc CXX=g++; else CC=cc CXX=c++; fi
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="-DCMAKE_OSX_ARCHITECTURES=$MAC_ARCHS -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0"; fi
          LAUNCH=""
          if command -v ccache >/dev/null 2>&1; then LAUNCH="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"; else echo "ccache is missing: building without it"; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=$CC -DCMAKE_CXX_COMPILER=$CXX $LAUNCH $EXTRA

      - name: Build
        id: build
        shell: bash
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          # (the caps keep an entry of the compiler cache within its share of GitHub's 10 GB; the Build step trims to the cap before the Save step, and the
          # objects a build used are the newest, so what a cap drops is what no job of this half used lately; Windows checks 2/2 outgrew 500M on Nov 7 and
          # rebuilt 83% of its files each run, so Windows has 800M: one run's entries come to about 8.4 GB)
          CCACHE_MAXSIZE: ${{ runner.environment == 'self-hosted' && '20G' || (matrix.name == 'windows' && '800M' || (matrix.name == 'linux' && '3G' || (contains(env.MAC_ARCHS, ';') && '1600M' || '1G'))) }}
          CCACHE_COMPILERCHECK: content
          # (only the job that packages: the others build their own programs)
          FULL_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.mac_both && matrix.part == 'checks' && matrix.shard == 1 && 'true' || 'false' }}
        run: |
          if command -v ccache >/dev/null 2>&1; then ccache --zero-stats; fi
          # (our own machine caps the parallel compiles through its runner settings: a compile of every core at once runs out of memory there)
          # A release (started by hand with mac_both on) builds everything in the job that packages; every other job builds only what its half of its part
          # uses (tools/ci_targets.sh).
          if [ "$FULL_BUILD" = true ]; then TARGETS=""; else TARGETS="--target $(bash tools/ci_targets.sh ${{ matrix.part }} "$RUNNER_OS" "$SHARD")"; fi
          echo "building: ${TARGETS:-everything}"
          cmake --build build --parallel ${CMAKE_BUILD_PARALLEL_LEVEL:-} $TARGETS
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
            # (what the Save step looks at: a build that compiled nothing leaves the cache as it was restored; "unknown" saves)
            m=$(ccache --print-stats 2>/dev/null | awk -F'\t' '$1 == "cache_miss" {print $2}')
            echo "misses=${m:-unknown}" >> "$GITHUB_OUTPUT"
            ccache --cleanup
          fi

      # Programs in the build folder find the GCC runtime through PATH, which can hold another GCC's copy first (the 20261004 runner image crashed in the
      # first test). Both jobs use the compiler's own copy, beside the programs, as the packaged program does.
      - name: GCC runtimes beside the programs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "GCC runtimes on PATH:"; which -a libstdc++-6.dll || true
          cp "$(cygpath -u "$IQTA_TOOLS")/mingw1310_64/bin/"{libgcc_s_seh-1,libstdc++-6,libwinpthread-1}.dll build/

      # (a Mac whose media tests fail: the plugin loader's own account of the multimedia plugin, for the first media test)
      - name: Media plugin diagnostics (macOS)
        if: runner.os == 'macOS' && matrix.part == 'tests'
        shell: bash
        run: |
          if [ -x build/jdtests ]; then
            DYLD_PRINT_LIBRARIES=1 QT_DEBUG_PLUGINS=1 QT_QPA_PLATFORM=offscreen JP_NO_TELEMETRY=1 build/jdtests --class DeckMediaTests mediaPlaybackPlaysASoundOrSaysWhy 2>&1 | grep -i -E "multimedia|ffmpeg|dlopen|dyld|not loaded|signature|Totals|FAIL|libav|libsw|Expected in" | head -80 || true
          fi
          exit 0

      - name: Test
        if: matrix.part == 'tests'
        timeout-minutes: 45
        shell: bash
        run: |
          # The programs run side by side, longest first, each with its own results file (Windows runners drop their console output)
          # (tools/ci_tests.sh): one after another they took 12 to 17 minutes.
          # (the list is the one the Build step builds: tools/ci_targets.sh; a program in both halves runs half of its test classes in each)
          bash tools/ci_tests.sh $(bash tools/ci_targets.sh tests "$RUNNER_OS" "$SHARD" run)
        env:
          QT_QPA_PLATFORM: offscreen
          JP_TEST_TRACE: '1'
          # (our own Linux machine has the processors to run the biggest programs in parts; GitHub's have two to four)
          CI_SPLIT: ${{ runner.environment == 'self-hosted' && '4' || '1' }}

      # What every app's window must pass (tests/appchecks): the first five minutes of a person who launches it with no file, its standard commands, and every one of its commands run
      # once on a blank document and once on one opened from a file. The four programs run side by side (they wait on conditions, not on time, so a busy machine only makes them
      # slower), each with its own results file. A hang fails in minutes, not hours.
      - name: App checks
        if: matrix.part == 'checks'
        timeout-minutes: 25
        shell: bash
        run: |
          # (the same runner as the tests: side by side, a results file each, the debugger's stack for a crash; on our own Linux machine each
          # program's three long checks run in four parts, JO_APPCHECK_SHARD; on Windows and macOS the second half runs crunchchecks in two parts for the same reason)
          bash tools/ci_tests.sh $(bash tools/ci_targets.sh checks "$RUNNER_OS" "$SHARD" run)
        env:
          QT_QPA_PLATFORM: offscreen
          JP_TEST_TRACE: '1'
          CI_SPLIT: ${{ runner.environment == 'self-hosted' && '4' || '1' }}

      - name: Export check PDFs
        if: matrix.part == 'checks' && matrix.shard == 1
        shell: bash
        run: |
          # PDFs exported by this platform's build, to compare against Linux.
          if [ "$RUNNER_OS" = "Windows" ]; then A=build/JeffPub.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then A=build/JeffPub.app/Contents/MacOS/JeffPub
          else A=build/JeffPub; fi
          test -x "$A" || { echo "$A was not built"; exit 1; }
          mkdir -p pdf-check
          "$A" --template newsletter-classic --export-pdf pdf-check/newsletter-classic.pdf || true
          "$A" --template flyer-announce --export-pdf pdf-check/flyer-announce.pdf || true
          "$A" tests/data/pub/poi-SampleBrochure.pub --export-pdf pdf-check/poi-SampleBrochure.pdf || true
          "$A" tests/data/pub/poi-SampleNewsletter.pub --export-pdf pdf-check/poi-SampleNewsletter.pdf || true
          ls -la pdf-check
        env:
          QT_QPA_PLATFORM: offscreen

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.part == 'checks' && matrix.shard == 1
        with:
          name: pdf-check-${{ matrix.name }}
          path: pdf-check

      # Help's topics as the project wiki's pages, written by the program
      # itself so they match what Help shows. Every build makes them (a bad
      # link fails here, before a merge); the wiki job below publishes them.
      - name: Export Help for the wiki
        if: runner.os == 'Linux' && matrix.part == 'checks'
        run: build/JeffPub --export-help-wiki help-wiki
        env:
          QT_QPA_PLATFORM: offscreen

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Linux' && matrix.part == 'checks'
        with:
          name: help-wiki
          path: help-wiki

      - name: Package (Windows)
        if: runner.os == 'Windows' && matrix.part == 'checks' && matrix.shard == 1
        shell: pwsh
        run: |
          # The suite's folder: both apps beside the Qt they share.
          New-Item -ItemType Directory -Force dist/JeffOffice | Out-Null
          Copy-Item build/JeffPub.exe, build/JeffDeck.exe dist/JeffOffice/
          # JeffWrite needs the same Qt as JeffPub; it is packaged only when the switch at the top says so.
          if ($env:SHIP_WRITE -eq 'true') { Copy-Item build/JeffWrite.exe dist/JeffOffice/ }
          # JeffCrunch needs the same Qt too.
          if ($env:SHIP_CRUNCH -eq 'true') { Copy-Item build/JeffCrunch.exe dist/JeffOffice/ }
          # Also copies the GCC runtime DLLs beside the programs.
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw dist/JeffOffice/JeffPub.exe
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw dist/JeffOffice/JeffDeck.exe
          # JeffDeck plays movies and sounds through Qt Multimedia's FFmpeg
          # plugin, which needs FFmpeg's DLLs beside it: ours (the ffmpeg job),
          # which are in Qt's folder, so windeployqt brings them with the
          # plugin; if a version of it doesn't, they come from ours, never from
          # Qt's. JeffPub doesn't link Qt Multimedia and gets neither.
          foreach ($name in 'avcodec', 'avformat', 'avutil', 'swresample', 'swscale') {
            if (-not (Test-Path "dist/JeffOffice/$name-*.dll")) { Copy-Item "ffmpeg-out/windows/bin/$name-*.dll" dist/JeffOffice/ }
          }
          if (-not (Test-Path dist/JeffOffice/multimedia/ffmpegmediaplugin.dll)) { throw "the FFmpeg multimedia plugin was not deployed" }
          if (-not (Test-Path dist/JeffOffice/avcodec-*.dll)) { throw "FFmpeg's DLLs were not deployed" }
          bash tools/use_ffmpeg.sh check dist/JeffOffice
          if ($LASTEXITCODE -ne 0) { throw "the FFmpeg DLLs are not ours" }
          Get-ChildItem dist/JeffOffice/*.dll | Select-Object -ExpandProperty Name
          Copy-Item LICENSE, ADDITIONAL-TERMS.md, README.md dist/JeffOffice/
          Copy-Item -Recurse resources/fonts dist/JeffOffice/fonts
          Copy-Item -Recurse resources/dict dist/JeffOffice/dict
          # PDFium, and its license texts and those of the libraries in it.
          Copy-Item build/pdfium.dll dist/JeffOffice/
          New-Item -ItemType Directory -Force dist/JeffOffice/licenses | Out-Null
          Copy-Item -Recurse third_party/pdfium/licenses dist/JeffOffice/licenses/pdfium
          # qpdf (passwords in PDFs) and libjpeg-turbo, which it is built with.
          Copy-Item -Recurse third_party/qpdf/licenses dist/JeffOffice/licenses/qpdf
          Copy-Item -Recurse third_party/libjpeg_turbo/licenses dist/JeffOffice/licenses/libjpeg-turbo
          # Qt's LGPL and source offer, Lucide, MPL, and the GCC runtime exception (the MinGW DLLs are here).
          Copy-Item packaging/licenses/* dist/JeffOffice/licenses/
          # FFmpeg's notice and license, for the libraries JeffDeck carries.
          Copy-Item -Recurse third_party/ffmpeg/licenses dist/JeffOffice/licenses/ffmpeg

      - name: Installer (Windows)
        if: runner.os == 'Windows' && matrix.part == 'checks' && matrix.shard == 1
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(JeffPub VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $opts = @{ Version = $ver }
          if ($env:SHIP_WRITE -eq 'true') { $opts.Write = $true }
          if ($env:SHIP_CRUNCH -eq 'true') { $opts.Crunch = $true }
          # Inno Setup 6 is on the runner image; the script prints its version and makes the license page's text.
          ./packaging/windows/build-installer.ps1 @opts
          New-Item -ItemType Directory -Force installer | Out-Null
          Move-Item packaging/windows/JeffOffice-Setup.exe installer/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Windows' && matrix.part == 'checks' && matrix.shard == 1
        with:
          name: JeffOffice-Setup
          path: installer

      # The command-line tool, for testing on Windows: it runs from the
      # program's folder (same DLLs). Not part of the release.
      - name: Developer tools (Windows)
        if: runner.os == 'Windows' && matrix.part == 'checks' && matrix.shard == 1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dev-tools | Out-Null
          Copy-Item build/jpubtool.exe, build/jdecktool.exe dev-tools/
          Copy-Item build/pdfium.dll dev-tools/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Windows' && matrix.part == 'checks' && matrix.shard == 1
        with:
          name: JeffOffice-windows-tools
          path: dev-tools

      - name: Package (Linux)
        if: runner.os == 'Linux' && matrix.part == 'checks'
        run: |
          mkdir -p dist/JeffOffice
          cp build/JeffPub build/JeffDeck LICENSE README.md dist/JeffOffice/
          if [ "$SHIP_WRITE" = true ]; then cp build/JeffWrite dist/JeffOffice/; fi
          if [ "$SHIP_CRUNCH" = true ]; then cp build/JeffCrunch dist/JeffOffice/; fi
          cp -r resources/fonts resources/dict dist/JeffOffice/

      - name: Linux packages (.deb and AppImage)
        if: runner.os == 'Linux' && matrix.part == 'checks'
        run: |
          mkdir -p tools-bin
          curl -sSLo tools-bin/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSLo tools-bin/linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x tools-bin/*
          export PATH="$PWD/tools-bin:$PATH" QMAKE="$QT_ROOT_DIR/bin/qmake" APPIMAGE_EXTRACT_AND_RUN=1
          packaging/linux/build-packages.sh build linux-packages
          # The packaged programs must start on their own bundled Qt.
          mkdir deb-check && dpkg-deb -x linux-packages/*.deb deb-check
          env -u LD_LIBRARY_PATH QT_QPA_PLATFORM=offscreen deb-check/opt/jeffoffice/bin/JeffPub --template flyer-announce --export-pdf deb-check/check.pdf
          test -s deb-check/check.pdf
          env -u LD_LIBRARY_PATH QT_QPA_PLATFORM=offscreen JP_NO_TELEMETRY=1 deb-check/opt/jeffoffice/bin/JeffDeck --screenshot deb-check/deck.png --size 800x600
          test -s deb-check/deck.png
          if [ "$SHIP_WRITE" = true ]; then
            env -u LD_LIBRARY_PATH QT_QPA_PLATFORM=offscreen JP_NO_TELEMETRY=1 deb-check/opt/jeffoffice/bin/JeffWrite --screenshot deb-check/write.png --size 800x600
            test -s deb-check/write.png
          fi
          if [ "$SHIP_CRUNCH" = true ]; then
            env -u LD_LIBRARY_PATH QT_QPA_PLATFORM=offscreen JP_NO_TELEMETRY=1 deb-check/opt/jeffoffice/bin/JeffCrunch --screenshot deb-check/crunch.png --size 800x600
            test -s deb-check/crunch.png
          fi
          # PDFium is in the package, with the license texts.
          test -f deb-check/opt/jeffoffice/lib/libpdfium.so
          # JeffDeck plays movies and sounds: Qt Multimedia's FFmpeg plugin and FFmpeg's libraries are in the package.
          test -f deb-check/opt/jeffoffice/plugins/multimedia/libffmpegmediaplugin.so
          ls deb-check/opt/jeffoffice/lib/libavcodec.so.*
          # ... and they are ours (the minimal build), not Qt's full one.
          sh tools/use_ffmpeg.sh check deb-check/opt/jeffoffice/lib
          # Everything the plugin links is in the package or on the system.
          if LD_LIBRARY_PATH=deb-check/opt/jeffoffice/lib ldd deb-check/opt/jeffoffice/plugins/multimedia/libffmpegmediaplugin.so | grep 'not found'; then exit 1; fi
          test -f deb-check/usr/share/doc/jeffoffice/pdfium/pdfium.txt
          test -f deb-check/usr/share/doc/jeffoffice/qpdf/qpdf-Apache-2.0.txt
          test -f deb-check/usr/share/doc/jeffoffice/libjpeg-turbo/libjpeg-turbo.md
          test -f deb-check/usr/share/doc/jeffoffice/ffmpeg/ffmpeg.txt
          test -f deb-check/usr/share/doc/jeffoffice/ffmpeg/LGPL-2.1.txt
          for f in LICENSE ADDITIONAL-TERMS.md licenses/LGPL-3.0.txt licenses/QT-NOTICE.txt licenses/LUCIDE-ISC.txt licenses/MPL-2.0.txt licenses/MPL-NOTICE.txt licenses/README.txt; do test -f deb-check/usr/share/doc/jeffoffice/$f; done
          ls -la linux-packages

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Linux' && matrix.part == 'checks'
        with:
          name: JeffOffice-linux-packages
          path: linux-packages

      - name: Package (macOS)
        if: runner.os == 'macOS' && matrix.part == 'checks' && matrix.shard == 1 && github.event_name == 'workflow_dispatch'
        run: |
          ver=$(sed -n 's/^project(JeffPub VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p dist macos-dmg
          apps="JeffPub JeffDeck"
          if [ "$SHIP_WRITE" = true ]; then apps="$apps JeffWrite"; fi
          if [ "$SHIP_CRUNCH" = true ]; then apps="$apps JeffCrunch"; fi
          for app in $apps; do
            cp -R build/$app.app dist/
            "$QT_ROOT_DIR/bin/macdeployqt" dist/$app.app
            # PDFium beside the Qt frameworks, where the program finds it,
            # and its license texts and those of the libraries in it.
            fw=dist/$app.app/Contents/Frameworks
            test -f "$fw/libpdfium.dylib" || cp build/_deps/pdfium/lib/libpdfium.dylib "$fw/"
            # The build's own path to it isn't for shipping (and would hide a
            # missing copy from the check below).
            install_name_tool -delete_rpath "$PWD/build/_deps/pdfium/lib" dist/$app.app/Contents/MacOS/$app || true
            otool -l dist/$app.app/Contents/MacOS/$app | grep -A2 LC_RPATH | grep path || true
            mkdir -p dist/$app.app/Contents/Resources/licenses
            cp -R third_party/pdfium/licenses dist/$app.app/Contents/Resources/licenses/pdfium
            cp -R third_party/qpdf/licenses dist/$app.app/Contents/Resources/licenses/qpdf
            cp -R third_party/libjpeg_turbo/licenses dist/$app.app/Contents/Resources/licenses/libjpeg-turbo
            # Qt's LGPL and source offer, Lucide, and MPL texts, and the GPL and Additional Terms (no GCC runtime here).
            for f in packaging/licenses/*; do case $f in *GCC-RUNTIME*) ;; *) cp "$f" dist/$app.app/Contents/Resources/licenses/ ;; esac; done
            cp LICENSE ADDITIONAL-TERMS.md dist/$app.app/Contents/Resources/
            # FFmpeg's notice and license go with JeffDeck, the only app that carries FFmpeg.
            if [ "$app" = JeffDeck ]; then cp -R third_party/ffmpeg/licenses dist/$app.app/Contents/Resources/licenses/ffmpeg; fi
            # Not yet signed with a developer certificate: an ad-hoc signature
            # lets it run on Apple silicon.
            codesign --force --deep --sign - dist/$app.app
            lipo -archs dist/$app.app/Contents/MacOS/$app
          done
          # JeffDeck plays movies and sounds through Qt Multimedia's FFmpeg plugin; macdeployqt brings the plugin and
          # FFmpeg's libraries with it. JeffPub doesn't link Qt Multimedia and gets neither.
          test -f dist/JeffDeck.app/Contents/PlugIns/multimedia/libffmpegmediaplugin.dylib
          ls dist/JeffDeck.app/Contents/Frameworks | grep -q '^libavcodec'
          # ... and they are ours (the minimal build, for both processors when the disk image is for both), not Qt's full one.
          sh tools/use_ffmpeg.sh check dist/JeffDeck.app
          for arch in $(echo "$MAC_ARCHS" | tr ';' ' '); do lipo -archs dist/JeffDeck.app/Contents/Frameworks/libavcodec.61.dylib | grep -q "$arch"; done
          test ! -d dist/JeffPub.app/Contents/Frameworks/QtMultimedia.framework
          test -f dist/JeffDeck.app/Contents/Resources/licenses/ffmpeg/ffmpeg.txt
          for app in $apps; do for f in LICENSE ADDITIONAL-TERMS.md licenses/LGPL-3.0.txt licenses/QT-NOTICE.txt licenses/LUCIDE-ISC.txt licenses/MPL-2.0.txt; do test -f dist/$app.app/Contents/Resources/$f; done; done
          # The packaged programs must start on their own bundled Qt (and PDFium).
          QT_QPA_PLATFORM=offscreen dist/JeffPub.app/Contents/MacOS/JeffPub --template flyer-announce --export-pdf dist/check.pdf
          test -s dist/check.pdf && rm dist/check.pdf
          QT_QPA_PLATFORM=offscreen JP_NO_TELEMETRY=1 dist/JeffDeck.app/Contents/MacOS/JeffDeck --screenshot dist/deck.png --size 800x600
          test -s dist/deck.png && rm dist/deck.png
          if [ "$SHIP_WRITE" = true ]; then
            QT_QPA_PLATFORM=offscreen JP_NO_TELEMETRY=1 dist/JeffWrite.app/Contents/MacOS/JeffWrite --screenshot dist/write.png --size 800x600
            test -s dist/write.png && rm dist/write.png
          fi
          if [ "$SHIP_CRUNCH" = true ]; then
            QT_QPA_PLATFORM=offscreen JP_NO_TELEMETRY=1 dist/JeffCrunch.app/Contents/MacOS/JeffCrunch --screenshot dist/crunch.png --size 800x600
            test -s dist/crunch.png && rm dist/crunch.png
          fi
          mkdir dmg-root && cp -R dist/*.app LICENSE README.md dmg-root/ && ln -s /Applications dmg-root/Applications
          # hdiutil now and then fails with "Resource busy" on the hosted
          # runners; a few tries a little apart get past it.
          for try in 1 2 3 4 5; do
            hdiutil create -volname "JeffOffice" -srcfolder dmg-root -ov -format UDZO macos-dmg/JeffOffice-$ver.dmg && break
            if [ "$try" = 5 ]; then exit 1; fi
            sleep 10
          done
          ls -la macos-dmg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'macOS' && matrix.part == 'checks' && matrix.shard == 1 && github.event_name == 'workflow_dispatch'
        with:
          name: JeffOffice-macos-dmg
          path: macos-dmg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.part == 'checks' && matrix.shard == 1
        with:
          name: JeffOffice-${{ matrix.name }}
          path: dist/JeffOffice

      # The compiler cache, as the Build step left it, when it compiled something (a run that only hit leaves the entry it restored as it is; restoring
      # keeps it from being evicted), even when a later step failed. Only main's runs and Linux's save: a branch or pull request on Windows or macOS
      # restores main's, and keeps its own out of the 10 GB.
      - name: Save the compiler cache
        if: ${{ !cancelled() && runner.environment != 'self-hosted' && (github.ref == 'refs/heads/main' || matrix.name == 'linux') && steps.build.outputs.misses != '' && steps.build.outputs.misses != '0' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ matrix.name == 'macos' && env.MAC_ARCHS || '' }}-${{ matrix.part }}${{ matrix.shard }}-${{ github.sha }}

  # A quick check of the Windows installer's script (a minute, not an hour): it is built here from stand-in files, by
  # hand-started runs only. The real installer is made by the Windows "checks" job above, from the real programs.
  installer-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      SHIP_WRITE: 'true'
      SHIP_CRUNCH: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Stand-in files
        shell: pwsh
        run: |
          $d = 'dist/JeffOffice'
          New-Item -ItemType Directory -Force $d | Out-Null
          foreach ($n in 'JeffPub', 'JeffDeck', 'JeffWrite', 'JeffCrunch') { Copy-Item "$env:windir/System32/notepad.exe" "$d/$n.exe" }
          foreach ($n in 'Qt6Core.dll', 'Qt6Gui.dll', 'pdfium.dll', 'libgcc_s_seh-1.dll') { Set-Content "$d/$n" "stand-in $n" }
          foreach ($n in 'platforms', 'styles', 'fonts', 'dict', 'licenses') { New-Item -ItemType Directory -Force "$d/$n" | Out-Null; Set-Content "$d/$n/x.txt" "stand-in $n" }
          Copy-Item LICENSE, README.md $d
      - name: Installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(JeffPub VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          ./packaging/windows/build-installer.ps1 -Version $ver -Write -Crunch
          New-Item -ItemType Directory -Force installer | Out-Null
          Move-Item packaging/windows/JeffOffice-Setup.exe installer/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JeffOffice-Setup-stand-in
          path: installer

  # After a push to main, replaces the project wiki's pages with Help's (the
  # ones the Linux build above exported); nothing is committed when they are
  # the same. Its own job so that only this one gets a token that can write.
  # A wiki with no first page yet is skipped with a notice, not an error.
  wiki:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency: wiki
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: tools/publish_help_wiki.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: help-wiki
          path: help-wiki

      - name: Publish Help to the wiki
        run: bash tools/publish_help_wiki.sh help-wiki "https://github.com/${{ github.repository }}.wiki.git" "${GITHUB_SHA::7}"
        env:
          GH_TOKEN: ${{ github.token }}
